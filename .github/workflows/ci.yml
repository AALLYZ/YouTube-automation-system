name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ytauto
          POSTGRES_PASSWORD: ytauto
          POSTGRES_DB: ytauto
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ytauto" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ytauto:ytauto@localhost:5433/ytauto_test
      REDIS_URL: redis://localhost:6380/0
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-0000000000000000000000000000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-pass

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python + deps
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests with coverage
        run: .venv/bin/python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
