# Production stack: api + worker + db + redis.
#   cp .env.prod.example .env.prod   # fill in secrets (never commit .env.prod)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The API is the only service with a published port. Put a TLS-terminating
# reverse proxy (Caddy/nginx/Traefik) in front of it for PUBLIC_HOST.

x-app: &app
  build:
    context: .
    dockerfile: api/Dockerfile
  image: ytauto-api:latest
  env_file: [.env.prod]
  environment:
    DATABASE_URL: postgresql+psycopg://ytauto:${POSTGRES_PASSWORD:?set in .env.prod}@db:5432/ytauto
    REDIS_URL: redis://redis:6379/0
    STORAGE_LOCAL_ROOT: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ytauto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytauto"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://ytauto:${POSTGRES_PASSWORD:?set in .env.prod}@db:5432/ytauto
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_ROOT: /data/storage
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.run"]
    environment:
      DATABASE_URL: postgresql+psycopg://ytauto:${POSTGRES_PASSWORD:?set in .env.prod}@db:5432/ytauto
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_ROOT: /data/storage
      RUN_MIGRATIONS: "false"
      JOBS_ASYNC: "true"

volumes:
  pgdata:
  redisdata:
  storage:
