services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytauto
      POSTGRES_PASSWORD: ytauto
      POSTGRES_DB: ytauto
    ports:
      - "5433:5432"
    volumes:
      - ytauto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytauto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - ytauto_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ytauto_pg:
  ytauto_redis:
